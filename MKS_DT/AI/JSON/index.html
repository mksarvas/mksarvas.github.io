<body>
    <header class="site-header">
        <!-- Responsiivinen navigaatio: pienellä näytöllä linkit avautuvat painikkeesta. -->

            <div class="container">
                <!-- Sivuston nimi toimii linkkinä etusivulle. -->
                <a class="navbar-brand fw-semibold" href="../index.html">MKS-DT | AI</a>
                <!-- Valikkopainike näkyy pienillä näytöillä ja ohjaa alla olevaa valikkoa. -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation" aria-expanded="false" aria-label="Avaa valikko">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Valikon linkit; ms-auto sijoittaa ne navigaation oikeaan reunaan. -->

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">

    <!-- Sivun pääsisältö. Bootstrap-luokat lisäävät reunavälin ja pystysuuntaisen tyhjän tilan. -->
    <main class="container py-5">



        <div id="vastaus">Tähän tulee se vastus</div>
    </main>

    <script>
        // Haetaan samassa kansiossa oleva JSON-tietue ja välitetään se kerro-funktiolle.
        fetch("tietue.JSON")
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("JSON-tietueen haku epäonnistui.");
                }
                return response.json();
            })
            .then(function (tietue) {
                kerro(tietue);
            })
            .catch(function (error) {
                console.error(error);
                document.getElementById("vastaus").textContent =
                    "Tietoja ei pystytty hakemaan. Tarkista, että sivua ajetaan verkkopalvelimelta ja tietue.JSON löytyy.";
            });

        // Näyttää JSON-tietueen tiedot sivulla.
        function kerro(obj) {
            let tiedot = "<h1>" + obj.otsikko + "</h1>";
            document.getElementById("vastaus").innerHTML = tiedot;
        }
    </script>

    <!-- Bootstrapin JavaScript mahdollistaa mobiilivalikon avaamisen ja sulkemisen. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
