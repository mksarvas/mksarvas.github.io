<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-md">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="index.html">Kukkasivu</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false"
                    aria-label="Avaa valikko">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Etusivu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#flowerCarousel">Kukkakaruselli</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="grid.html">Grid</a>
                        </li>
                                                    <li class="nav-item">
                                                        <a class="nav-link" href="haitari.html">Haitari</a>
                                                    </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h1 class="text-center mb-4">Bootstrap grid</h1>

        <h2 class="h5">Kolme yhtä leveää saraketta</h2>
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="grid-box">col-12 col-md-4</div>
            </div>
            <div class="col-12 col-md-4">
                <div class="grid-box">col-12 col-md-4</div>
            </div>
            <div class="col-12 col-md-4">
                <div class="grid-box">col-12 col-md-4</div>
            </div>
        </div>

        <h2 class="h5">Eri levyiset sarakkeet</h2>
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-8">
                <div class="grid-box">col-12 col-md-8</div>
            </div>
            <div class="col-12 col-md-4">
                <div class="grid-box">col-12 col-md-4</div>
            </div>
        </div>

        <h2 class="h5">Neljä saraketta: 1 / 2 / 4 per rivi</h2>
        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="grid-box">1</div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="grid-box">2</div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="grid-box">3</div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="grid-box">4</div>
            </div>
        </div>

        <h2 class="h5">Kuvat gridissä</h2>
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <img src="../flowers-2704500_1280.jpg" class="img-fluid grid-image" alt="Värikkäitä kukkia">
            </div>
            <div class="col-12 col-md-4">
                <img src="../roses-3901824_1280.jpg" class="img-fluid grid-image" alt="Ruusuja">
            </div>
            <div class="col-12 col-md-4">
                <img src="../tulip-4739907_1280.jpg" class="img-fluid grid-image" alt="Tulppaani">
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
