<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kukkakaruselli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-md">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="#alku">Kukkasivu</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false"
                    aria-label="Avaa valikko">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#alku">Etusivu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#flowerCarousel">Kukkakaruselli</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="grid.html">Grid</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="haitari.html">Haitari</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="alku" class="container py-4">
        <h1 class="text-center mb-4">Kukkakaruselli</h1>

        <div id="flowerCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#flowerCarousel" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Kuva 1"></button>
                <button type="button" data-bs-target="#flowerCarousel" data-bs-slide-to="1"
                    aria-label="Kuva 2"></button>
                <button type="button" data-bs-target="#flowerCarousel" data-bs-slide-to="2"
                    aria-label="Kuva 3"></button>
            </div>

            <div class="carousel-inner rounded">
                <div class="carousel-item active">
                    <img src="../flowers-2704500_1280.jpg" class="d-block carousel-image" alt="Värikkäitä kukkia">
                    <div class="carousel-caption">
                        <h2 class="h4">Kesän kukkia</h2>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="../roses-3901824_1280.jpg" class="d-block carousel-image" alt="Ruusuja">
                    <div class="carousel-caption">
                        <h2 class="h4">Kauniit ruusut</h2>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="../tulip-4739907_1280.jpg" class="d-block carousel-image" alt="Tulppaani">
                    <div class="carousel-caption">
                        <h2 class="h4">Kevään tulppaani</h2>
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#flowerCarousel"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Edellinen kuva</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#flowerCarousel"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Seuraava kuva</span>
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
